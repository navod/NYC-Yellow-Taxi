# One PostgreSQL instance (Airflow metadata DB + taxi warehouse DB)
# and a minimal Airflow 3 deployment using the LocalExecutor.

x-airflow-common:
  &airflow-common
  image: nyc-taxi-airflow:3.4.0
  build: 
    context: .
    dockerfile: Docker/Dockerfile_airflow
  env_file:
    - ${ENV_FILE_PATH:-.env}
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # Local demo only: skip the login screen, every visitor is an admin.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow:${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}@postgres/airflow
    # Airflow 3: tasks talk to the API server, not straight to the metadata DB.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in .env}
    # Warehouse connection, exposed to DAGs as the Airflow Connection "nyc_taxi_dw" (must match WAREHOUSE_CONN_ID).
    AIRFLOW_CONN_NYC_TAXI_DW: postgresql://${DW_USER:-dw_user}:${DW_PASSWORD:-dw_password}@postgres:5432/${DW_DB:-taxi_dw}
    # Pipeline settings read by src/config/settings.py
    PROJECT_ROOT: /opt/airflow/project
    PYTHONPATH: /opt/airflow/project
    ETL_LOG_DIR: /opt/airflow/logs/etl
    ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - .:/opt/airflow/project
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy


services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DW_PASSWORD:?set DW_PASSWORD in .env}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}
      POSTGRES_DB: postgres
      DW_USER: ${DW_USER}
      DW_PASSWORD: ${DW_PASSWORD}
      DW_DB: ${DW_DB}
    ports:
      - "${DW_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    command: db migrate
    restart: "no"

  superset:
    build:
      context: Docker
      dockerfile: Dockerfile_superset
    image: nyc-taxi-superset:6.1.0
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?set SUPERSET_SECRET_KEY in .env}
      SUPERSET_METADATA_URI: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}@postgres:5432/superset
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:?set SUPERSET_ADMIN_USER in .env}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?set SUPERSET_ADMIN_PASSWORD in .env}
      WAREHOUSE_SQLALCHEMY_URI: postgresql+psycopg2://${DW_USER:?set DW_USER in .env}:${DW_PASSWORD:?set DW_PASSWORD in .env}@postgres:5432/${DW_DB:?set DW_DB in .env}
    command:
      - bash
      - -c
      - |
        superset db upgrade &&
        superset fab create-admin --username "$$SUPERSET_ADMIN_USER" --password "$$SUPERSET_ADMIN_PASSWORD" \
            --firstname Admin --lastname User --email admin@example.com &&
        superset init &&
        /usr/bin/run-server.sh
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./superset/bootstrap_dashboard.py:/app/bootstrap/bootstrap_dashboard.py:ro
      - ./sql:/app/sql:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8088/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
