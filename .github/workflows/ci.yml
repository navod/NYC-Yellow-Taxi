name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint setup.sh
        run: |
          bash -n setup.sh
          shellcheck setup.sh

      - name: Cache raw data
        uses: actions/cache@v4
        with:
          path: data/raw
          key: nyc-taxi-raw-${{ hashFiles('setup.sh') }}

      - name: Run setup script
        run: ./setup.sh
        env:
          MONTHS: "2023-01"

      - name: Verify dependencies are consistent
        run: .venv/bin/python -m pip check

      - name: Verify databases were created
        run: |
          set -a; source .env; set +a
          docker compose exec -T postgres psql -U "$DW_USER" -d "$DW_DB" -Atc 'select 1'
          docker compose exec -T postgres psql -U postgres -Atc "select datname from pg_database" | grep -qx superset

      - name: Show Postgres logs on failure
        if: failure()
        run: docker compose logs postgres

      - name: Tear down
        if: always()
        run: docker compose down -v
