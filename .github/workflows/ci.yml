name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint setup.sh
        run: |
          bash -n setup.sh
          shellcheck setup.sh

      - name: Cache raw data
        uses: actions/cache@v4
        with:
          path: data/raw
          key: nyc-taxi-raw-${{ hashFiles('setup.sh') }}

      - name: Run setup script
        run: ./setup.sh
        env:
          MONTHS: "2023-01"

      - name: Verify dependencies are consistent
        run: .venv/bin/python -m pip check
