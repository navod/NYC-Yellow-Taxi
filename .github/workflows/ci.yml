name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts
        run: |
          bash -n scripts/*.sh
          shellcheck scripts/*.sh

      # docker-compose.yml requires these; generate throwaway values for this run only.
      - name: Generate CI passwords
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "AIRFLOW_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "AIRFLOW_JWT_SECRET=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Cache raw data
        uses: actions/cache@v4
        with:
          path: data/input
          key: nyc-taxi-raw-${{ hashFiles('scripts/setup.sh') }}

      - name: Run setup script
        run: ./scripts/setup.sh
        env:
          MONTHS: "2023-01"

      - name: Verify dependencies are consistent
        run: .venv/bin/python -m pip check

      - name: Run tests
        run: ./scripts/run_tests.sh -q

      - name: Verify databases were created
        run: |
          set -a; source .env; set +a
          docker compose exec -T postgres psql -U "$DW_USER" -d "$DW_DB" -Atc 'select 1'
          docker compose exec -T postgres psql -U postgres -Atc "select datname from pg_database" | grep -qx superset

      - name: Show Postgres logs on failure
        if: failure()
        run: docker compose logs postgres

      - name: Tear down
        if: always()
        run: docker compose down -v
